services:
  - type: web
    name: telegram-movies-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aldrama3-db
          property: connectionString
      - key: API_BASE_URL
        value: https://dwapp.arabypros.com
      - key: API_KEY_PATH
        sync: false
      - key: CLIENT_UUID
        sync: false
      - key: APP_PACKAGE
        value: com.alam.aldrama3
      - key: REDIRECT_BASE_URL
        value: https://dwapp.qzz.io
      - key: VALIDATION_BASE_URL
        value: https://test.arabypros.com
      - key: TMDB_IMAGE_BASE_URL
        value: https://image.tmdb.org/t/p

databases:
  - name: aldrama3-db
    databaseName: aldrama3
    user: aldrama3user
    plan: free
